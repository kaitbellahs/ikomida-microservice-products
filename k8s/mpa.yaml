apiVersion: autoscaling.gke.io/v1beta1
kind: MultidimPodAutoscaler
metadata:
  name: $NAME-autoscaler
  namespace: ikomida
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: $NAME-$TYPE
  goals:
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 90
  constraints:
    global:
      minReplicas: 1
      maxReplicas: $MAX_REPLICAS
    containerControlledResources: [memory]
    container:
      - name: "*"
        requests:
          minAllowed:
            memory: 0Gi
          maxAllowed:
            memory: 500Mi
  policy:
    updateMode: Auto
